name: 每日专家演讲监控

# 定时触发：每天北京时间9:00（UTC时间1:00）
on:
  schedule:
    - cron: '0 1 * * *'
  # 支持手动触发测试
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor script
        run: python monitor.py
